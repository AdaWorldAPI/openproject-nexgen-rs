# Second Rails corpus, measured with the same compiler and no code change.
# Corpus mode only (`rails-compile --corpus`): no slice is compiled.
output = "target/openproject-unused"

[app]
name = "openproject"
namespace = "openproject"
source_env = "OPENPROJECT_SRC"
# config/application.rb: config.load_defaults 6.1
rails_load_defaults = "6.1"
autoload_roots = ["app/models", "app/models/concerns", "lib/open_project", "modules/auth_saml/app/models", "modules/avatars/app/models", "modules/backlogs/app/models", "modules/bim/app/models", "modules/boards/app/models", "modules/budgets/app/models", "modules/calendar/app/models", "modules/costs/app/models", "modules/documents/app/models", "modules/github_integration/app/models", "modules/gitlab_integration/app/models", "modules/grids/app/models", "modules/job_status/app/models", "modules/ldap_departments/app/models", "modules/ldap_groups/app/models", "modules/meeting/app/models", "modules/my_page/app/models", "modules/openid_connect/app/models", "modules/overviews/app/models", "modules/recaptcha/app/models", "modules/reporting/app/models", "modules/resource_management/app/models", "modules/storages/app/models", "modules/two_factor_authentication/app/models", "modules/webhooks/app/models", "modules/wikis/app/models", "modules/xls_export/app/models"]
migrations = []
framework_roots = ["ActiveRecord::Base", "ApplicationRecord"]

[slice]
models = []
verbatim_file = "verbatim.txt"

[klickwege]
access = { controller_roots = ["app/controllers", "modules/*/app/controllers"], filter_macros = ["before_action", "prepend_before_action", "append_before_action", "skip_before_action"] }

[[klickwege.class_macros]]
stratum = "K9"
name = "contracts"
roots = ["app/contracts", "modules/*/app/contracts"]
macros = ["attribute", "validate", "validates", "attribute_alias"]

[klickwege.crosswalk]
roots = ["app/contracts", "modules/*/app/contracts"]
attribute_macros = ["attribute"]
lambda_macros = ["attribute"]
receivers = ["model"]
include_macros = ["include"]
definer_macros = ["attr_reader", "attr_writer", "attr_accessor", "delegate", "alias_method", "alias_attribute", "class_attribute", "cattr_reader", "cattr_accessor", "mattr_reader", "mattr_accessor"]
model_from_namespace = true
attribute_method_suffixes = ["_change", "_changed?", "_was", "_before_last_save", "_in_database", "?", "="]
model_roots = ["app/models", "modules/*/app/models", "lib"]
gems_env = "OPENPROJECT_GEMS_DIR"
gemfile_lock = "Gemfile.lock"
gems = ["disposable", "activemodel", "activerecord", "activesupport", "closure_tree", "reform"]
builtin_names = ["Array", "Integer", "String", "Hash", "Float", "method", "send", "public_send", "respond_to?", "is_a?", "kind_of?", "instance_of?", "nil?", "tap", "then", "freeze", "frozen?", "dup", "clone", "raise", "fail", "puts", "p", "format", "sprintf", "lambda", "proc", "loop", "catch", "throw", "require", "binding", "block_given?", "itself", "object_id", "class", "instance_variable_get", "instance_variable_set", "define_singleton_method", "singleton_class"]
