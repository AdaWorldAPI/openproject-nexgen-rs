[toolchain]
# AdaWorldAPI ecosystem-wide pin: rust 1.98.1, the same channel as
# `AdaWorldAPI/ndarray`, `lance-graph` and `OGAR`. The argon2 fork's
# `ndarray-simd` feature pulls ndarray master, whose floor is 1.98.
#
# (An earlier note here said a patch number such as `1.95.1` is not a valid
# channel. It is: rustup accepts `1.98.1`, and the sibling repos pin it.)
channel = "1.98.1"
components = ["rustfmt", "clippy"]
