method = "user_allowed_to_add"
effect = "consults:allowed_in_any_project?"
level = "guard_evaluation"
repair = "-"
comparability = "same"
ruby = { kind = "fact", produced = "in_body:allowed_in_any_project?(", extractor = "located", file = "app/contracts/work_packages/create_contract.rb", needle = "allowed_in_any_project?(:add_work_packages", fact = "user_allowed_to_add asks allowed_in_any_project?" }
