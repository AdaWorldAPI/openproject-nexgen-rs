# ORE/SLAG reconciliation config: WorkPackage create admission (OpenProject -> nexgen).
#
# The data of the reconciliation in `crates/op-codegen-pipeline/tests/`. Generic
# loading, schema checking and rendering live in `src/ore_slag_config.rs`; the app-side
# evaluators (named predicates, the schedule_manually witness, the effective-guards
# generator) live in `tests/reconcile_create_admission.rs`.
#
# Claim order is the ledger order. Rust paths are the normalized form
# (`reconcile::normalize`). `UPDATE_ORE_SLAG=1` rewrites only the `[[learned]]` block
# below the marker at the end of the file, and adds a TODO stub for a slag row that
# has neither a `[[residual]]` entry nor a default for its reason.

[scope]
application = "openproject"
model = "WorkPackage"
operation = "create"
source_root = "openproject"
target_root = "nexgen"

[extractors]
scan = "admission_gen::contract_scan_facts (ExtractionGap::ContractDeclScan)"
located = "literal located in the source (no parse)"
ruff = "ruff_ruby_spo::extract_contract_guards"
ruff_blocks = "ruff_ruby_spo::extract_attribute_blocks"

[gates]
witness = "tests/reconcile_create_admission.rs::ore_slag::ore_slag_ledger_and_lifecycle"
drift = "tests/create_transition_differential.rs::checked_in_admission_table_is_what_the_generator_produces"
required_companions = ["DriftCheck"]

[[claim]]
phase = "registration"
method = "CreateContract.validate(:user_allowed_to_add)"
effect = "declares-validator"
level = "registration"
repair = "none: different levels; the invocation is its own row"
comparability.different = { ruby = "DSL registration of a validator", rust = "no registration step; admit_create calls the function" }
ruby = { kind = "fact", produced = "has_validator", extractor = "scan", file = "app/contracts/work_packages/create_contract.rb", needle = "validate :user_allowed_to_add", fact = "CreateContract registers user_allowed_to_add as a validator" }
rust.edges = [
  ["op_contracts::work_packages::admission::admit_create", "op_contracts::work_packages::admission::user_allowed_to_add"],
]

[[claim]]
phase = "callback"
method = "CreateContract#validate"
effect = "invokes:user_allowed_to_add"
level = "callback_invocation"
repair = "-"
comparability = "same"
ruby = { kind = "fact", produced = "has_validator", extractor = "scan", file = "app/contracts/work_packages/create_contract.rb", needle = "validate :user_allowed_to_add", fact = "validating the create contract runs user_allowed_to_add" }
rust.edges = [
  ["op_contracts::work_packages::admission::admit_create", "op_contracts::work_packages::admission::user_allowed_to_add"],
]

[[claim]]
phase = "admission"
method = "CreateWorkPackageService.call"
effect = "evaluates:WorkPackages::CreateContract"
level = "admission"
repair = "-"
comparability = "same"
ruby = { kind = "fact", produced = "has_validator", extractor = "located + scan", file = "app/services/work_packages/create_service.rb", needle = "contract_class: WorkPackages::CreateContract", fact = "CreateService admits a create through WorkPackages::CreateContract" }
rust.edges = [
  ["op_services::work_packages::create::CreateWorkPackageService::call", "op_services::work_packages::create::CreateWorkPackageService::admit"],
  ["op_services::work_packages::create::CreateWorkPackageService::admit", "op_contracts::work_packages::admission::admit_create"],
]

[[claim]]
phase = "admission"
method = "user_allowed_to_add"
effect = "requires:add_work_packages"
level = "admission"
repair = "data witness: the generator drift check (create_transition_differential)"
comparability = "same"
ruby = { kind = "fact", produced = "add_perm", extractor = "scan", file = "app/contracts/work_packages/create_contract.rb", needle = "allowed_in_project?(:add_work_packages", fact = "the create is authorized by add_work_packages" }
rust.data = { krate = "op_contracts", file = "crates/op-contracts/src/work_packages/generated_create_admission.rs", item = "ADD_PERMISSION" }

[[claim]]
