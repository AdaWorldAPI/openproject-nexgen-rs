method = "user_allowed_to_add"
effect = "consults:admin?"
level = "guard_evaluation"
repair = "harvest User#allowed_in_project? to see whether the admin bypass matches"
comparability = "same"
ruby = { kind = "absent_in_body", body = "add_body", must_not_contain = "admin", extractor = "located", file = "app/contracts/work_packages/create_contract.rb", looked_for = "an admin check in the body (Ruby's admin bypass is inside User#allowed_in_project?, not harvested)" }
rust.edges = [
  ["op_contracts::work_packages::admission::user_allowed_to_add", "op_contracts::base::UserContext::is_admin"],
]

[[claim]]
phase = "guard"
method = "admit_create"
effect = "evaluates:writable?-per-submitted-attribute"
level = "guard_evaluation"
repair = "ruff: lower BaseContract#writable? (condition AND permission)"
comparability = "same"
ruby = { kind = "not_harvested", why = "BaseContract#writable? (app/contracts/base_contract.rb) is not harvested by any extractor here" }
rust.edges = [
  ["op_contracts::work_packages::admission::admit_create", "op_contracts::work_packages::admission::is_writable"],
]

[[claim]]
phase = "guard"
method = "CreateContract.attribute(:schedule_manually).block"
effect = "validates:validate_has_predecessors_or_children"
level = "guard_evaluation"
repair = "the call is compared, not its condition: Rust calls the validator unconditionally and evaluates `model.schedule_automatically?` inside it (FACT_SCHEDULE_MANUALLY); the condition is witnessed by the schedule_manually runtime differential (ore_slag)"
comparability = "same"
ruby = { kind = "witness", name = "schedule_block" }
rust.edges = [
  ["op_contracts::work_packages::admission::admit_create", "op_contracts::work_packages::admission::validate_has_predecessors_or_children"],
]

[[claim]]
phase = "admission"
method = "mutation::create"
effect = "checks:add_work_packages-in-project"
level = "admission"
repair = "Charon: structure async bodies (mutation::create)"
comparability = "same"
ruby = { kind = "fact", produced = "add_perm", extractor = "scan", file = "app/contracts/work_packages/create_contract.rb", needle = "allowed_in_project?(:add_work_packages", fact = "a create needs add_work_packages in the model's project" }
rust.edges = [
  ["op_services::work_packages::mutation::create", "op_services::work_packages::mutation::may"],
]

[[claim]]
phase = "persistence"
method = "mutation::create"
effect = "inserts:work_packages"
level = "persistence"
repair = "Charon: structure async bodies (mutation::create, PgMutationStore::insert_wp)"
comparability = "same"
ruby = { kind = "fact", produced = "always", extractor = "located", file = "app/services/work_packages/create_service.rb", needle = "work_package.save(validate: false)", fact = "an admitted create saves the work package" }
rust.edges = [
  ["op_services::work_packages::mutation::create", "op_services::work_packages::mutation::CreationStore::insert_wp"],
]

[[claim]]
phase = "admission"
method = "POST /api/v3/work_packages"
effect = "enters:mutation::create"
level = "admission"
repair = "Charon: structure async bodies (create_work_package_core); Ruby: harvest the API v3 create endpoint"
comparability = "same"
ruby = { kind = "not_harvested", why = "the API v3 create endpoint is not harvested" }
rust.edges = [
  ["op_api::handlers::work_packages::create_work_package_core", "op_services::work_packages::mutation::create"],
]

# The lowered `writable:` guards of the effective contract chain, one claim per
