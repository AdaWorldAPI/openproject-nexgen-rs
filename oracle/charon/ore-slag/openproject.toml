method = "user_allowed_to_add"
effect = "consults:allowed_in_project?"
level = "guard_evaluation"
repair = "-"
comparability = "same"
ruby = { kind = "fact", produced = "add_perm_and_in_body:allowed_in_project?(", extractor = "scan", file = "app/contracts/work_packages/create_contract.rb", needle = "allowed_in_project?(:add_work_packages", fact = "user_allowed_to_add asks allowed_in_project?" }
rust.edges = [
