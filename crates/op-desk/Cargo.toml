[package]
name = "op-desk"
description = "Polyfill table and model specs for the OpenProject tables of the work-package journey, generated by rails-compiler (crates/rails-compiler, copied from zammad-rs) from openproject.toml and OpenProject's db/structure.sql. The desk holds the polyfill store and a Quack catalog over the same rows; not wired into the server yet."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rails-polyfill = { path = "../rails-polyfill" }
polyfill-feed = { path = "../polyfill-feed" }
quack-shadow = { path = "../quack-shadow" }
serde_json = { workspace = true }

[dev-dependencies]
# The generator (examples/generate.rs, tests/regenerate.rs), as zammad-rs runs
# rails-compiler beside its generated crate rather than inside it.
rails-compiler = { path = "../rails-compiler" }
ruff_ruby_spo = { git = "https://github.com/AdaWorldAPI/ruff", branch = "main" }
ogar-from-ruff = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
toml = "0.8"

[features]
# Negative control: `date` columns map to the emitter's `DateTime` again. The
# schema-fidelity test must fail.
disable-date-column = []
