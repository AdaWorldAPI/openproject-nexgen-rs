[package]
name = "op-server"
version.workspace = true
edition.workspace = true
description = "HTTP server binary for OpenProject RS"

[[bin]]
name = "openproject-server"
path = "src/main.rs"

[dependencies]
op-core = { path = "../op-core" }
op-api = { path = "../op-api" }
op-db = { path = "../op-db" }
op-auth = { path = "../op-auth" }
op-services = { path = "../op-services" }

# OGAR render-bake pipeline: ClassView x FieldMask -> HtmlListView.
ogar-render-askama = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main" }
a2ui-layout = { git = "https://github.com/AdaWorldAPI/a2ui-rs", branch = "main" }

# Browser sign-in (Zitadel via ogar-oidc), lifted unchanged from zammad-rs.
web-login = { path = "../web-login", features = ["reqwest", "axum"] }

axum.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["signal"] }
tower.workspace = true
tower-http = { workspace = true, features = ["compression-gzip", "cors", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
config.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
# Write-path guard: HMAC-SHA256 CSRF tokens (hand-rolled over sha2, no extra crate) + OS entropy.
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# The fake identity provider of web-login's tests is reused as it is
# (`#[path]` include in `signin_tests.rs`), so its dependencies are needed here.
base64 = "0.22"
ogar-encryption = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
p256 = { git = "https://github.com/AdaWorldAPI/elliptic-curves", branch = "master", default-features = false, features = ["ecdsa", "alloc"] }
